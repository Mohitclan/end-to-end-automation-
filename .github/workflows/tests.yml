# Runs every test on every push and pull request (P1.01). Protect `main` in the
# repository settings so both jobs must pass before a pull request can merge.
# A "skipped" count in the summary means Redis wasn't reachable: check the
# service's port mapping and TEST_REDIS_URL.
name: tests
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q -rs
        env:
          TEST_REDIS_URL: redis://localhost:6379/0

  # The same suite on Postgres, the production database (TEST_DATABASE_URL, see README).
  test-postgres:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: growthstack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev,postgres]"
      - run: python -m pytest -q -rs
        env:
          TEST_REDIS_URL: redis://localhost:6379/0
          TEST_DATABASE_URL: postgresql+psycopg://postgres:dev@localhost:5432/growthstack_test
