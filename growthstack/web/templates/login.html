{% extends "base.html" %}
{% block title %}Log in · growthstack{% endblock %}
{% block content %}
<div class="panel" style="max-width:380px;margin:64px auto">
  <h1>Log in</h1>
  <form method="post" action="/login">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" required>
    <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
    <p><button>Log in</button></p>
  </form>
  <p class="muted" style="font-size:13px">Accounts are created with <span class="mono">growthstack create-user</span>.</p>
</div>
{% endblock %}
