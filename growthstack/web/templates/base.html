<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}growthstack{% endblock %}</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1f1c; --muted:#6b6f68; --line:#e2e0d8;
  --accent:#2f6b4f; --accent-ink:#ffffff; --warn:#a15c07; --bad:#b3261e; --good:#2f6b4f;
  --chart-line:#2f6b4f; --chart-fill:rgba(47,107,79,.12); --bar:#2f6b4f; --chip:#eeece5;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#141613; --panel:#1c1f1b; --ink:#e7e8e3; --muted:#9a9f96; --line:#2e322c;
  --accent:#7cc39c; --accent-ink:#0f1a14; --warn:#e2a23b; --bad:#f2827a; --good:#7cc39c;
  --chart-line:#7cc39c; --chart-fill:rgba(124,195,156,.14); --bar:#7cc39c; --chip:#262a24;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
header.top{display:flex;align-items:center;gap:20px;padding:12px 24px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header.top .brand{font-weight:700;letter-spacing:-.01em;color:var(--ink);text-decoration:none}
header.top nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
header.top nav a{padding:6px 10px;border-radius:6px;color:var(--muted);text-decoration:none}
header.top nav a.on,header.top nav a:hover{background:var(--chip);color:var(--ink)}
main{max-width:1180px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:22px;margin:0 0 16px;letter-spacing:-.01em}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.kpi .v{font-size:28px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.spark{width:100%;height:56px;display:block;margin-top:8px}
.empty-chart{color:var(--muted);font-size:13px;padding:12px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);padding:8px 6px}
td{border-bottom:1px solid var(--line);padding:8px 6px;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;background:var(--chip);font-size:12px;white-space:nowrap}
.chip.good{color:var(--good)} .chip.bad{color:var(--bad)} .chip.warn{color:var(--warn)}
.bar-row{display:grid;grid-template-columns:140px 1fr 48px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.bar-track{height:10px;background:var(--chip);border-radius:99px;overflow:hidden}
.bar-fill{display:block;height:100%;background:var(--bar);border-radius:99px}
.bar-value{text-align:right;font-variant-numeric:tabular-nums}
form.inline{display:inline}
input,textarea,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 9px;width:100%}
textarea{min-height:160px;font-family:var(--mono);font-size:13px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
button,.btn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);padding:7px 14px;border-radius:6px;cursor:pointer;text-decoration:none;display:inline-block}
button.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
button.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.flash{padding:10px 14px;border-radius:8px;margin-bottom:16px;border:1px solid var(--line);background:var(--panel)}
.flash.error{border-color:var(--bad);color:var(--bad)}
.muted{color:var(--muted)} .mono{font-family:var(--mono);font-size:13px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
pre.wrap{white-space:pre-wrap;font-family:var(--mono);font-size:13px;margin:0}
@media (max-width:640px){.bar-row{grid-template-columns:100px 1fr 40px} main{padding:16px}}
</style>
</head>
<body>
{% if user %}
<header class="top">
  <a class="brand" href="/">growthstack</a>
  <nav>
    {% set here = request.url.path %}
    <a href="/" class="{{ 'on' if here == '/' }}">Dashboard</a>
    <a href="/leads" class="{{ 'on' if here.startswith('/leads') }}">Leads</a>
    <a href="/approvals" class="{{ 'on' if here.startswith('/approvals') }}">Approvals</a>
    <a href="/import" class="{{ 'on' if here.startswith('/import') }}">Import</a>
    <a href="/dnc" class="{{ 'on' if here.startswith('/dnc') }}">Do-not-contact</a>
    <a href="/setup" class="{{ 'on' if here.startswith('/setup') }}">Setup</a>
  </nav>
  <span class="muted">{{ user.email }}</span>
  <form class="inline" method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf }}"><button class="ghost">Log out</button></form>
</header>
{% endif %}
<main>
{% if flash %}<div class="flash {{ flash.kind }}" role="status">{{ flash.message }}</div>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
