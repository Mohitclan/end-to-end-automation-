[project]
name = "growthstack"
version = "0.1.0"
description = "Lead pipeline, outreach sequencer, do-not-contact list and growth dashboard that ties the free tool stack together."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pydantic-settings>=2.4",
  "dnspython>=2.6",
  "bullmq>=3.4",
  "redis>=5.0",
  "langgraph>=1.0",
  "langgraph-checkpoint-sqlite>=3.0",
  "anthropic>=2.0",
  "resend>=2.0",
  "posthog>=6.0",
  "google-api-python-client>=2.100",
  "google-auth>=2.30",
  "checkdmarc>=6.0",
  "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
growthstack = "growthstack.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["growthstack*"]

[tool.setuptools.package-data]
growthstack = ["web/templates/*.html", "web/static/*", "verify/data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["redis: needs a running Redis server (REDIS_URL)"]
