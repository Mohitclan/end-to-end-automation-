  PostHog + cookie banner for the marketing site (task P2.01 / P2.02).
  Ready to paste: add this whole file's contents to every page, just before </body>.

  Project: US Cloud (us.i.posthog.com), project key below (phc_ keys are public by design).

  What it does
  * First visit, no choice yet: PostHog runs with in-memory persistence only (no
    cookies, no localStorage) and session recording OFF. The banner asks.
  * Accept: cookies + localStorage persistence, session recording starts.
  * Decline: PostHog stops capturing for this visitor.
  * The choice is stored in localStorage under "gs_cookie_consent" (a consent record,
    needed to remember the answer) and read BEFORE PostHog starts, so returning
    visitors are not asked again and keep their PostHog identity.

  Stricter option: to capture nothing at all before a choice, add
  opt_out_capturing_by_default: true for first-time visitors too.

  Signups: send `user_signed_up` from the website's BACKEND (see
  docs/posthog-signup-event.md). After login, call posthog.identify(String(user.id))
  in the browser so earlier anonymous visits join the same person.

  Loader stub: copied verbatim from https://posthog.com/docs/libraries/js (2026-10-28).
  Options: https://posthog.com/docs/libraries/js/config
-->

<script>
  (function () {
    var CONSENT_KEY = 'gs_cookie_consent';
    function readChoice() { try { return localStorage.getItem(CONSENT_KEY); } catch (e) { return null; } }
    function saveChoice(v) { try { localStorage.setItem(CONSENT_KEY, v); } catch (e) {} }
    var choice = readChoice(); // 'granted' | 'denied' | null

    function showBanner(ph) {
      var banner = document.createElement('div');
      banner.setAttribute('role', 'dialog');
      banner.setAttribute('aria-label', 'Cookie preferences');
      banner.id = 'gs-cookie-banner';
      banner.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;max-width:560px;margin:0 auto;' +
        'background:#1d1f1c;color:#fff;padding:16px;border-radius:10px;font:14px/1.5 system-ui,sans-serif;' +
        'box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:2147483647';
      banner.innerHTML =
        '<p style="margin:0 0 12px">We use cookies to understand how our site is used and to improve it, ' +
        'including recordings of visits. You can say no and the site works the same.</p>' +
        '<button type="button" data-c="yes" style="margin-right:8px;padding:8px 14px;border:0;border-radius:6px;background:#7cc39c;color:#0f1a14;cursor:pointer">Accept</button>' +
        '<button type="button" data-c="no" style="padding:8px 14px;border:1px solid #888;border-radius:6px;background:transparent;color:#fff;cursor:pointer">Decline</button>';
      banner.addEventListener('click', function (e) {
        var c = e.target && e.target.getAttribute('data-c');
        if (!c) return;
        if (c === 'yes') {
          saveChoice('granted');
          ph.opt_in_capturing();
          ph.set_config({ persistence: 'localStorage+cookie' });
          ph.startSessionRecording();
        } else {
          saveChoice('denied');
          ph.opt_out_capturing();
        }
        banner.remove();
      });
      document.body.appendChild(banner);
    }

    posthog.init('phc_uG9cBXt78SKkmXJMKyGbAGztK3QYbM7oEcArjimY6Kku', {
      api_host: 'https://us.i.posthog.com',
      defaults: '2026-08-30',
      person_profiles: 'identified_only',
      persistence: choice === 'granted' ? 'localStorage+cookie' : 'memory',
      disable_session_recording: choice !== 'granted',
      opt_out_capturing_by_default: choice === 'denied',
      loaded: function (ph) {
        if (choice) return; // already answered on an earlier visit
        if (document.body) showBanner(ph);
        else document.addEventListener('DOMContentLoaded', function () { showBanner(ph); });
      },
    });
  })();
</script>
